name: Pre-release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
jobs:
  prepare:
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      annotated: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
