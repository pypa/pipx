name: 🏷️ Pre-release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
jobs:
  prepare:
    name: 🏷️ Prepare Towncrier release
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      annotated: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
