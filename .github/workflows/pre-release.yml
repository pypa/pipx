name: Pre-release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
concurrency:
  group: pre-release
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The next version comes from the tags.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/tools/bin" >>"$GITHUB_PATH"
      - id: prepare
        uses: tox-dev/github-workflows/prepare-towncrier@a250ca3524857236e288764651851010939b6f71
        with:
          bump: ${{ inputs.bump }}
          changelog: docs/changelog.rst
          fragments: changelog.d
          format: rst
          patch: ${{ runner.temp }}/release.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  validate:
    needs: assemble
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      patch-sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/tools/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-release-patch@a250ca3524857236e288764651851010939b6f71
        with:
          version: ${{ needs.assemble.outputs.version }}
          changelog: docs/changelog.rst
          fragments: changelog.d
          patch: ${{ runner.temp }}/release-patch/release.patch
          expected-sha: ${{ github.sha }}
      - name: Record validated patch digest
        id: digest
        run: |
          read -r patch_sha _ < <(sha256sum "$RUNNER_TEMP/release-patch/release.patch")
          echo "sha=$patch_sha" >>"$GITHUB_OUTPUT"
  push:
    needs: [assemble, validate]
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: tox-dev/github-workflows/validate-release-patch@a250ca3524857236e288764651851010939b6f71
        with:
          version: ${{ needs.assemble.outputs.version }}
          changelog: docs/changelog.rst
          fragments: changelog.d
          patch: ${{ runner.temp }}/release-patch/release.patch
          expected-sha: ${{ github.sha }}
          expected-patch-sha: ${{ needs.validate.outputs.patch-sha }}
          checks: "false"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: tox-dev/github-workflows/commit-and-tag@a250ca3524857236e288764651851010939b6f71
        with:
          version: ${{ needs.assemble.outputs.version }}
          token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          message: Release ${{ needs.assemble.outputs.version }}
          annotated: "true"
