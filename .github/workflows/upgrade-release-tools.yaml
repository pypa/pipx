name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      build-requirements: |-
        Cython>=3.0
        setuptools>=80
      python-version: "3.15"
      exclude-newer-packages: release-creator=2026-10-22T13:51:56Z
