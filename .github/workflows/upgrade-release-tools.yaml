name: 🔒 Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      additional-lock: pylock.zipapp.toml
      additional-lock-selection: project
      additional-matrix-python: ">=3.11,<3.12"
      additional-matrix-platforms: linux_x86_64 windows_amd64 macos_arm64
      additional-matrix-implementations: cpython
