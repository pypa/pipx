name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@a250ca3524857236e288764651851010939b6f71
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      python-version: "3.15"
      check-workflow: tests.yml
