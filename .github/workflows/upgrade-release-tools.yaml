name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@4417ce2a6208a7e5afcf3b3291d174cb2eccbbd1
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      python-version: "3.15"
      exclude-newer-packages: filelock=2026-10-19T02:00:00Z
      check-workflow: tests.yml
