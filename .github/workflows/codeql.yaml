name: 🛡️ CodeQL
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    - cron: "0 9 * * 2"
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions","python"]'
      paths-ignore: '["docs","scripts/check_distribution_manpage.py","scripts/generate_man.py","scripts/list_test_packages.py","scripts/release.py","scripts/test_packages_support.py","scripts/update_package_cache.py","testdata","tests"]'
