name: Recheck hook cooldown
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  recheck:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/recheck-hook-update-cooldown@fcba1cc52c8e8bbb8c3305ee5e4bc454b9ab0c50
        with:
          workflow: tests.yml
          job-name: hook-cooldown
