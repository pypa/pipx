name: Recheck hook cooldown
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  recheck:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/recheck-hook-update-cooldown@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
        with:
          workflow: tests.yml
          job-name: hook-cooldown
