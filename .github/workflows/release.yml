name: Release
on:
  push:
    tags: ["*.*.*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    name: Gate release on the test suite
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
  build-package:
    name: Build pipx package
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release checks
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: release-creator tags "$TAG"
      - name: Build sdist and wheel
        env:
          UV_EXCLUDE_NEWER: "1 week"
        run: uv build --sdist --wheel --out-dir dist
      - name: Check artifact versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          ((${#wheels[@]} == 1 && ${#sdists[@]} == 1))
          for path in "${wheels[@]}" "${sdists[@]}"; do
            case "${path#dist/}" in
            pipx-"$TAG"-*.whl | pipx-"$TAG".tar.gz) ;;
            *)
              echo "::error::$path is not version $TAG"
              exit 1
              ;;
            esac
          done
      - name: Check package descriptions
        run: twine check dist/*
      - name: Check wheel contents
        run: check-wheel-contents --no-config dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  previous:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Find previous release
        id: previous
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          git tag --list | release-creator tags "$TAG" --previous | sed 's/^/tag=/' >>"$GITHUB_OUTPUT"
  metadata:
    needs: previous
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        if: needs.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous.outputs.tag }}
        run: >-
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Fetch first-release metadata
        if: needs.previous.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  notes:
    needs: metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@5e11f2254a4dcb7102747d312ad7db48a2e9b0cb
        with:
          tag: ${{ github.ref_name }}
          changelog: docs/changelog.rst
          repository: ${{ github.repository }}
          issue-role: issue
          artifact-url: https://pypi.org/project/pipx/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  pypi-publish:
    name: Publish pipx to PyPI
    needs: [build-package, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pipx/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  create-release:
    name: Create a release on GitHub's UI
    needs: [pypi-publish, notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes/release-notes.md"
  upload-zipapp:
    name: Upload zipapp to GitHub Release
    needs: create-release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pipx.pyz
          path: ${{ runner.temp }}/zipapp
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/zipapp/pipx.pyz"
