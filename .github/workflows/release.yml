name: 🚀 Release
on:
  push:
    tags: ["*.*.*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  build-package:
    name: 🏗️ Build pipx package
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Set source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Select locked build backend
        id: constraints
        uses: tox-dev/github-workflows/export-build-constraints@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
      - name: 🏗️ Build sdist and wheel
        env:
          BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
        run: uv build --sdist --wheel --out-dir dist --build-constraints "$BUILD_CONSTRAINTS" --require-build-hashes
      - name: 📤 Store distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  zipapp:
    name: 🏗️ Build pipx zipapp
    needs: build-package
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Set source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact-id }}
          path: ${{ runner.temp }}/dist
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked zipapp tools
        uses: tox-dev/github-workflows/install-locked-tools@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
        with:
          groups: zipapp
          venv: ${{ runner.temp }}/tools
      # shiv's pip would resolve the runtime dependencies fresh and drop colorama on Linux, so install the hashed runtime
      # selection that pylock.zipapp.toml locks for each zipapp target, and the built wheel. The lock's environments name
      # Windows as AMD64, while uv's Windows target reports x86_64, so the copy drops them and uv checks the package
      # markers and requires-python against each target alone.
      - name: 📦 Install locked runtime packages
        env:
          SITE: ${{ runner.temp }}/zipapp-site
          TAG: ${{ github.ref_name }}
          DIST: ${{ runner.temp }}/dist
          LOCK: ${{ runner.temp }}/zipapp-lock/pylock.zipapp.toml
        run: |
          set -euo pipefail
          unset UV_EXCLUDE_NEWER UV_EXCLUDE_NEWER_PACKAGE
          mkdir "$(dirname "$LOCK")"
          sed '/^environments = \[$/,/^\]$/d' pylock.zipapp.toml >"$LOCK"
          for platform in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            uv pip install --no-config --preview-features pylock --target "$SITE" --python 3.15 --python-version 3.11 \
              --python-platform "$platform" --group project-runtime --only-binary :all: --require-hashes -r "$LOCK"
          done
          uv pip install --no-config --target "$SITE" --python 3.15 --no-deps --no-index "$DIST/pipx-$TAG-py3-none-any.whl"
      - name: 🏗️ Build zipapp
        env:
          SITE: ${{ runner.temp }}/zipapp-site
        run: |
          mkdir "$RUNNER_TEMP/zipapp"
          shiv --site-packages "$SITE" -c pipx -o "$RUNNER_TEMP/zipapp/pipx.pyz" --reproducible
      - name: 📤 Store zipapp
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zipapp
          path: ${{ runner.temp }}/zipapp/pipx.pyz
          if-no-files-found: error
  zipapp-test:
    name: 🧪 Test pipx zipapp on ${{ matrix.os }}
    needs: zipapp
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    steps:
      - name: 🐍 Set up Python 3.11
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.11"
          ignore-empty-workdir: true
      - name: 📩 Download zipapp
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.zipapp.outputs.artifact-id }}
          path: ${{ runner.temp }}/zipapp
      - name: 🧪 Test zipapp by installing black
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/zipapp/pipx.pyz" install black
  notes:
    name: 📝 Render GitHub Release notes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/tools
      - name: 📝 Render release notes
        uses: tox-dev/github-workflows/render-release-notes@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
        with:
          tag: ${{ github.ref_name }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/pipx/${{ github.ref_name }}/
      - name: 📤 Store release notes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  pypi-publish:
    name: 🚀 Publish to PyPI
    needs: [build-package, notes, zipapp-test]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pipx/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact-id }}
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
  release:
    name: 🚀 Publish GitHub Release
    needs: [build-package, notes, zipapp, pypi-publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          ignore-empty-workdir: true
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact-id }}
          path: dist/
      - name: 📩 Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-notes
      - name: 📩 Download zipapp
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.zipapp.outputs.artifact-id }}
          path: ${{ runner.temp }}/zipapp
      - name: 🔍 Verify PyPI artifacts
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
        with:
          project: pipx
          version: ${{ github.ref_name }}
          dist: dist
      - name: 🚀 Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@64359a1fc6231df83d3bf2674688264d6fd34494 # 6.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
          assets-directory: ${{ runner.temp }}/zipapp
