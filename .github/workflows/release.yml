name: Release
on:
  push:
    tags:
      - "*.*.*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  default-python: "3.14"
jobs:
  test:
    name: Gate release on the test suite
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
  build-package:
    name: Build pipx package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.ref_name }}"
          persist-credentials: false
      - name: Set up Python ${{ env.default-python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.default-python }}
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Validate distributions and match the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pip install twine packaging
          twine check dist/*
          python - "${RELEASE_TAG}" <<'PY'
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename
          from packaging.version import Version

          tag = Version(sys.argv[1])
          _, built = parse_sdist_filename(next(pathlib.Path("dist").glob("*.tar.gz")).name)
          if built != tag:
              sys.exit(f"Built version {built} does not match release tag {tag}")
          print(f"Built version {built} matches release tag {tag}")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
  pypi-publish:
    name: Publish pipx to PyPI
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/pipx
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  create-release:
    name: Create a release on GitHub's UI
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release
        run: |
          gh release create --repo pypa/pipx "${RELEASE_TAG}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
  upload-zipapp:
    name: Upload zipapp to GitHub Release
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.ref_name }}"
          persist-credentials: false
      - name: Set up Python ${{ env.default-python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.default-python }}
      - name: Install tox
        run: pip install tox
      - name: Build zipapp
        run: tox run -e zipapp
      - name: Upload to release
        run: |
          gh release upload --repo pypa/pipx "${RELEASE_TAG}" pipx.pyz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
