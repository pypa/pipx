name: Release
on:
  push:
    tags:
      - "*.*.*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  default-python: "3.15"
permissions: {}
jobs:
  test:
    name: Gate release on the test suite
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
  build-package:
    name: Build pipx package
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.ref_name }}"
          persist-credentials: false
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            ! grep -Fq "$TAG <https://github.com/pypa/pipx/tree/$TAG>" docs/changelog.rst; then
            echo "::error::docs/changelog.rst has no section for $TAG"
            exit 1
          fi
      - name: Set up Python ${{ env.default-python }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_VENV_SEED: "true"
        with:
          enable-cache: false
          activate-environment: true
          python-version: ${{ env.default-python }}
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Validate distributions and match the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pip install twine packaging
          twine check dist/*
          python - "${RELEASE_TAG}" <<'PY'
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename
          from packaging.version import Version

          tag = Version(sys.argv[1])
          _, built = parse_sdist_filename(next(pathlib.Path("dist").glob("*.tar.gz")).name)
          if built != tag:
              sys.exit(f"Built version {built} does not match release tag {tag}")
          print(f"Built version {built} matches release tag {tag}")
          PY
      - name: Check wheel contents
        run: uvx --from 'check-wheel-contents>=0.6.3' check-wheel-contents --no-config dist
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  pypi-publish:
    name: Publish pipx to PyPI
    needs: build-package
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/p/pipx
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  create-release:
    name: Create a release on GitHub's UI
    needs: pypi-publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release
        run: |
          set -euo pipefail
          awk -v tag="$RELEASE_TAG" '
            index($0, "`" tag " <https://github.com/pypa/pipx/tree/" tag ">`_") == 1 { found = 1; next }
            found && /^`[0-9]+\.[0-9]+\.[0-9]+ </ { exit }
            found && $0 !~ /^[=-]+$/ { print }
          ' docs/changelog.rst > "$RUNNER_TEMP/release-notes.md"
          python3 - "$RUNNER_TEMP/release-notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          body = path.read_text()
          body = re.sub(r":user:`([^`]+)`", r"\1", body)
          body = re.sub(r":(?:issue|pr):`(\d+)`", r"#\1", body)
          body = re.sub(r":[a-z]+:`~?([^`]+)`", lambda match: f"`{match.group(1).split('.')[-1]}`", body)
          path.write_text(body.replace("``", "`"))
          PY
          test -s "$RUNNER_TEMP/release-notes.md"
          printf '\n[PyPI release](https://pypi.org/project/pipx/%s/)\n' "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          previous=$({ gh api 'repos/pypa/pipx/releases?per_page=100' --paginate --jq '.[].tag_name'; printf '%s\n' "$RELEASE_TAG"; } | grep -E '^[0-9]+(\.[0-9]+){2,3}$' | sort -Vu | awk -v tag="$RELEASE_TAG" '$0 == tag { print previous; exit } { previous = $0 }')
          if [[ -n "$previous" ]]; then
            printf '\n**Full Changelog**: https://github.com/pypa/pipx/compare/%s...%s\n' "$previous" "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          else
            printf '\n**Full Changelog**: https://github.com/pypa/pipx/commits/%s\n' "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create --repo pypa/pipx "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
  upload-zipapp:
    name: Upload zipapp to GitHub Release
    needs: create-release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.ref_name }}"
          persist-credentials: false
      - name: Set up Python ${{ env.default-python }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_VENV_SEED: "true"
        with:
          enable-cache: false
          activate-environment: true
          python-version: ${{ env.default-python }}
      - name: Install tox
        run: pip install tox
      - name: Build zipapp
        run: tox run -e zipapp
      - name: Upload to release
        run: |
          gh release upload --repo pypa/pipx "${RELEASE_TAG}" pipx.pyz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
