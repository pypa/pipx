name: 📝 Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  changelog:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@6.8.0
        with:
          groups: release-news
          venv: ${{ runner.temp }}/tools
      - name: 🔍 Validate news fragments
        uses: tox-dev/github-workflows/validate-news@6.8.0
        with:
          additional-lock: pylock.zipapp.toml
          additional-lock-selection: project
          additional-matrix-python: ">=3.11,<3.12"
          additional-matrix-platforms: linux_x86_64 windows_amd64 macos_arm64
          additional-matrix-implementations: cpython
