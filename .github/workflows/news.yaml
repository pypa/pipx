name: 📝 Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  changelog:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@534a196a132a52365c464e1227d4c46f30968f29 # 6.4.0
        with:
          groups: release-news
          venv: ${{ runner.temp }}/tools
      - name: 🔍 Validate news fragments
        uses: tox-dev/github-workflows/validate-news@534a196a132a52365c464e1227d4c46f30968f29 # 6.4.0
        with:
          additional-lock: pylock.zipapp.toml
          additional-lock-selection: project
          additional-matrix-python: ">=3.11,<3.12"
          additional-matrix-platforms: linux_x86_64 windows_amd64 macos_arm64
          additional-matrix-implementations: cpython
