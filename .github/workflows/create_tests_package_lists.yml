name: Create tests package lists for offline tests
on:
  workflow_dispatch:
concurrency:
  group: create-tests-package-lists-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  create_package_lists:
    name: Create package lists
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11", "3.10"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 is still in beta; setup-python resolves stable releases for every other matrix entry
          allow-prereleases: true
          cache: "pip"
      - name: Install nox
        run: python -m pip install nox
      - name: Create lists
        run: nox --non-interactive --session create_test_package_list-${{ matrix.python-version }} -- ./new_tests_packages
      - name: Store reports as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lists-${{ matrix.os }}-${{ matrix.python-version }}
          path: ./new_tests_packages
