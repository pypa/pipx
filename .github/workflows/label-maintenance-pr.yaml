name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@fcba1cc52c8e8bbb8c3305ee5e4bc454b9ab0c50
        with:
          fragments: changelog.d
