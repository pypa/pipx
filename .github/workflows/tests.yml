name: 🧪 tests
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test ${{ matrix.py }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        py: ["3.15", "3.15t", "3.14", "3.13", "3.12", "3.11"]
        include:
          - os: windows-2025
            py: "3.15"
          - os: xcode-27
            py: "3.15"
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      - name: 🐍 Set up Python ${{ matrix.py }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: ${{ matrix.py }}
      - name: 🐍 Register Python with the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv python install "${{ matrix.py }}"
          $pythonPath = uv python find "${{ matrix.py }}" --system
          $registryPath = "HKCU:\Software\Python\PythonCore\${{ matrix.py }}"
          New-Item "$registryPath\InstallPath" -Force -Value (Split-Path $pythonPath) | Out-Null
          New-ItemProperty "$registryPath\InstallPath" -Name ExecutablePath -Value $pythonPath -Force | Out-Null
          New-ItemProperty $registryPath -Name SysVersion -Value "${{ matrix.py }}" -Force | Out-Null
          New-ItemProperty $registryPath -Name SysArchitecture -Value "64bit" -Force | Out-Null
          py -${{ matrix.py }} -c "import sys; print(sys.executable)"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 💾 Cache .pipx_tests/package_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pipx_tests/package_cache/${{ matrix.py }}
          # actions/cache never re-saves an existing key, so key on the package lists to pick up new packages
          key: pipx-tests-package-cache-${{ runner.os }}-${{ matrix.py }}-${{ hashFiles('testdata/tests_packages/*.txt') }}
          restore-keys: pipx-tests-package-cache-${{ runner.os }}-${{ matrix.py }}-
      - name: 📦 Set up test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.py }}
      - name: 📦 Seed package cache
        run: tox exec -e ${{ matrix.py }} -- python scripts/update_package_cache.py testdata/tests_packages .pipx_tests/package_cache/
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.py }}
        timeout-minutes: 30
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
  type:
    name: 🔎 Type check
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 🔎 Run ty
        run: tox run -e type
  pkg-meta:
    name: 🔍 Check package distributions
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 🔍 Check package metadata
        run: tox run -e pkg_meta
  man:
    name: 📖 Build man page
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 📖 Build man page
        run: tox run -e man
      - name: 📖 Show man page
        run: man -l build/man/pipx.1
  zipapp:
    name: 🏗️ Build zipapp
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the oldest supported Python consumes the artifact while tox builds it with the same
      # interpreter as the release workflow, so this job reproduces the release scenario
      - name: 🐍 Set up Python 3.11
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.11"
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 🏗️ Build zipapp
        run: tox run -e zipapp
      - name: 🧪 Test zipapp by installing black
        run: |
          python ./pipx.pyz --version
          python ./pipx.pyz install black
      - name: 📤 Store zipapp
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipx.pyz
          path: pipx.pyz
  zipapp-windows:
    name: 🧪 Test zipapp on Windows
    needs: zipapp
    runs-on: windows-2025
    steps:
      - name: 🐍 Set up Python 3.11
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.11"
          ignore-empty-workdir: true
      - name: 📩 Download zipapp
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pipx.pyz
      - name: 🧪 Test zipapp by installing black
        run: |
          python .\pipx.pyz --version
          python .\pipx.pyz install black
  gate:
    name: 🚦 Required checks pass
    if: always()
    needs: [test, type, pkg-meta, man, zipapp, zipapp-windows]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all needed jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(to_entries[]; .value.result == "success")' <<<"$NEEDS_JSON"
