[build-system]
build-backend = "hatchling.build"
requires = [
  "docutils>=0.21.2",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
]

[project]
name = "pipx"
import-names = [ "pipx" ]
description = "Install and Run Python Applications in Isolated Environments"
keywords = [
  "cli",
  "install",
  "pip",
  "Virtual Environment",
  "workflow",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Chad Smith", email = "chadsmith.software@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "argcomplete>=3.7.2",
  "colorama>=0.4.6; sys_platform=='win32'",
  "filelock>=4.2",
  "packaging>=26.3",
  "platformdirs>=4.12.2",
  "userpath!=1.9,>=1.9.2",
]
optional-dependencies.uv = [
  "uv>=0.12.22",
]
urls."Issue Tracker" = "https://github.com/pypa/pipx/issues"
urls."Source Code" = "https://github.com/pypa/pipx"
urls.Changelog = "https://pipx.pypa.io/latest/changelog.html"
urls.Documentation = "https://pipx.pypa.io"
urls.Homepage = "https://pipx.pypa.io"
scripts.pipx = "pipx.__main__:cli"

[dependency-groups]
dev = [
  { include-group = "docs-live" },
  { include-group = "lint" },
  { include-group = "man" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "docutils>=0.21.2",
  "flit-core>=4.1",
  "pypiserver[passlib]>=2.4.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
  "pytest-subprocess>=1.6",
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
  "setuptools>=84; python_version>='3.12'",
]
type = [
  "gitpython>=3.2",
  "hatchling>=1.32.4",
  "ty>=0.0.84",
  "types-docutils>=0.22.3.20260724",
  { include-group = "docs" },
  { include-group = "test" },
]
docs = [
  "furo>=2025.12.19",
  "sphinx>=8.1.3",
  "sphinx-argparse-cli>=1.19",         # generate the CLI reference from pipx's argparse parser so it cannot drift
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-codeautolink>=0.19",         # link the names in code blocks to the reference
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",              # the card grid on the landing page
  "sphinx-issues>=6",                  # the :issue:/:pr: roles used in the changelog and notes
  "sphinx-last-updated-by-git>=0.3.8",
  "sphinx-llm!=1.1,>=1",
  "sphinx-notfound-page>=1.1",         # a versioned 404 page
  "sphinx-reredirects>=0.1.6",         # keep old MkDocs URLs alive after the move to Sphinx
  "sphinx-sitemap>=2.9",               # emit sitemap.xml for crawlers
  "sphinxcontrib-mermaid>=2.1.1",      # the .. mermaid:: directive used across the explanation diagrams
  "sphinxcontrib-towncrier>=0.5.0a0",  # render unreleased news fragments as a draft changelog section
  "sphinxext-opengraph>=0.13",         # OpenGraph tags for link previews
  "towncrier>=26.9",
]
build = [
  "cython>=3",
  "docutils>=0.21.2",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "setuptools>=80",
]
docs-live = [
  "sphinx-autobuild>=2025.8.25",
  { include-group = "docs" },
]
lint = [
  "pre-commit>=4.6.2",
]
man = [
  "docutils>=0.21.2",
]
release = [
  "prek>=0.5",
  "release-creator>=4.1",
  "towncrier>=26.9",
  "uv>=0.12.22",
]
release-news = [
  "release-creator>=4.1",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=4.1",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.1",
  "towncrier>=26.9",
]
zipapp = [
  "shiv>=1.0.8",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "docs/README.md" } ]
build.hooks.custom = {}
build.hooks.vcs.version-file = "src/pipx/version.py"
build.targets.wheel.shared-data = { "build/man" = "share/man/man1" }
build.targets.sdist.include = [
  "/docs/man",
  "/hatch_build.py",
  "/logo.png",
  "/pipx_demo.gif",
  "/src",
]

[tool.uv]
dependency-groups.release = { requires-python = ">=3.15" }
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }

[tool.ruff]
line-length = 120
extend-exclude = [
  "testdata",
]
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # no copyright header
  "D",                                         # ignore documentation for now
  "docstring-missing-exception",               # broken with sphinx docs
  "docstring-missing-returns",                 # no restructuredtext support yet
  "docstring-missing-yields",                  # no restructuredtext support yet
  "hardcoded-bind-all-interfaces",             # possible binding to all interfaces
  "implicit-namespace-package",                # no implicit namespaces here
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` and `no-blank-line-before-class` are incompatible
  "missing-trailing-comma",                    # conflicts with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` and `multi-line-summary-second-line` are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "single-line-implicit-string-concatenation", # conflicts with formatter
  "subprocess-without-shell-equals-true",      # using subprocess is alright
  "suspicious-subprocess-import",              # using subprocess is alright
]
lint.per-file-ignores."src/pipx/main.py" = [
  "import-outside-top-level", # each command loads its module on dispatch to keep CLI startup fast
]
lint.per-file-ignores."src/pipx/venv.py" = [
  "stdlib-module-shadowing", # module shadows the standard library
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests
  "D",                                    # don't care about documentation in tests
  "FBT",                                  # don't care about booleans as positional arguments in tests
  "implicit-namespace-package",           # no implicit namespace
  "magic-value-comparison",               # magic value used in comparison
  "pytest-fixture-autouse",               # shared setup fixtures are meant to apply to every test
  "subprocess-without-shell-equals-true", # subprocess call: check for execution of untrusted input
  "too-many-arguments",                   # too many arguments to function definition
]
lint.isort = { known-first-party = [
  "helpers",
  "package_info",
  "pipx",
], required-imports = [
  "from __future__ import annotations",
] }
lint.mccabe.max-complexity = 15
lint.preview = true

[tool.codespell]
# case sensitive etc
ignore-regex = "\\b(UE|path/doesnt/exist)\\b"
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = ".git,*.pdf,*.svg,.nox,testdata,.mypy_cache"
check-hidden = true

[tool.ty]
src.include = [ "hatch_build.py", "scripts", "src", "tests" ]
environment.python-version = "3.15"
rules.unused-ignore-comment = "error"

[tool.pytest]
ini_options.minversion = "8"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "-ra", "--strict-config", "--strict-markers" ]
ini_options.markers = [
  "all_packages: test install with maximum number of packages",
]
ini_options.filterwarnings = [
  "error",
  # importlib.metadata warns before returning None for a dist-info carrying no Name; venv_inspect handles that case
  # and Python 3.15 turns it into the KeyError the code already catches
  "ignore:Implicit None on return values is deprecated:DeprecationWarning",
]
ini_options.log_level = "INFO"
# the limit itself comes from PYTEST_TIMEOUT in tox.toml; session fixtures that build shared libs stay outside it
ini_options.timeout_func_only = true

[tool.coverage]
run.relative_files = true
# tox installs pipx as a wheel, so map its site-packages copy back onto src/ in reports
paths.source = [ "src", "*/site-packages", "*\\site-packages" ]

[tool.towncrier]
package = "pipx"
directory = "changelog.d"
filename = "docs/changelog.rst"
start_string = ".. towncrier release notes start\n"
template = ".github/towncrier-template.rst"
title_format = ""
issue_format = ":issue:`{issue}`"
underlines = [
  "=",
  "-",
  "~",
]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.flake8-lazy]
standalone.line-length = 120
standalone.lazy-exclude-modules = [
  # records whether stderr is a terminal at startup, which decides if spinners animate
  "pipx.animate",
  # records whether stdout is a terminal at startup and runs colorama.init() on Windows before anything prints
  "pipx.colors",
  # reads PIPX_FETCH_PYTHON and PIPX_FETCH_MISSING_PYTHON at startup
  "pipx.constants",
  # reads PIPX_USE_EMOJI and USE_EMOJI at startup
  "pipx.emojis",
]

[tool.nab]
mode = "universal"
base-group = "project-runtime"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"
constraints = [ "pytest-timeout!=2.5.0" ]
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64", "linux_aarch64", "macos_arm64", "windows_amd64" ]
# temporary, delete after 2026-11-02
packages.release-creator.uploaded-prior-to = 2026-10-26T18:24:46Z
# temporary, delete after 2026-10-28: the docstrfmt hook pins sphinx 9.2.0
packages.sphinx.uploaded-prior-to = 2026-10-21T00:05:13Z
