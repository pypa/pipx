<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>pipx has moved</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://pipx.pypa.io/stable/">
    <meta http-equiv="refresh" content="1; url=https://pipx.pypa.io/stable/">
    <script>
      // GitHub Pages serves this file for every missing path, which is the only hook a static host gives us for the
      // deep links that READMEs still point at. The MkDocs site published one directory per page, so map those slugs
      // onto the Sphinx layout they became; anything unknown lands on the documentation root.
      var moved = {
        "": "",
        "installation": "how-to/install-pipx.html",
        "getting-started": "tutorial/getting-started.html",
        "docs": "reference/cli.html",
        "troubleshooting": "how-to/troubleshoot.html",
        "examples": "reference/examples.html",
        "comparisons": "explanation/comparisons.html",
        "how-pipx-works": "explanation/how-pipx-works.html",
        "programs-to-try": "reference/programs-to-try.html",
        "contributing": "contributing.html",
        "changelog": "changelog.html"
      };
      var slug = location.pathname.replace(/^\/pipx\/?/, "").replace(/\/$/, "");
      var page = Object.prototype.hasOwnProperty.call(moved, slug) ? moved[slug] : "";
      location.replace("https://pipx.pypa.io/stable/" + page + location.hash);
    </script>
  </head>
  <body>
    <p>The pipx documentation now lives at <a href="https://pipx.pypa.io/stable/">pipx.pypa.io</a>.</p>
  </body>
</html>
