repos:
  - repo: local
    hooks:
      # towncrier orphan fragments (+name) and typos in the type render without a PR link or get silently
      # dropped from the changelog, so enforce the <PR number>.<type>.md naming here
      - id: changelog-fragment-naming
        name: changelog fragments are named <PR number>.<type>.md
        language: fail
        entry: changelog.d entries must be named <PR number>.(feature|bugfix|performance|doc|removal|misc).md
        files: ^changelog\.d/(?!\.gitignore$)(?!\d+\.(feature|bugfix|performance|doc|removal|misc)(\.\d+)?\.md$)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-case-conflict
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-mkdocs>=5.3
          - mdformat-gfm>=1
          - mdformat-gfm-alerts>=2.1
          - mdformat-footnote>=0.1.3
          - mdformat-config>=0.2.1
          - mdformat-front-matters>=2
        exclude: ^(docs/changelog\.md|testdata)
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.29.4
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--show-fixes", "--exit-non-zero-on-fix"]
      - id: ruff-format
  # ty runs in the `type` tox environment via GitHub Actions, not here: pre-commit.ci cannot install its
  # heavier dependency set (e.g. GitPython) in its sandbox.
  # Configuration for codespell is in pyproject.toml
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli>=2.4.1
        exclude: ^testdata
